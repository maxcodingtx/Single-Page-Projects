<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Squad</title>
    <link rel="stylesheet" href="style.css">
    <link href="img/Tottenham-favicon.png" rel="icon" />
</head>

<body>

    <header class="u-flex u-items-center">
        <img src="img/Tottenham-logo.jpg" alt="Tottenham Logo" class="header__logo">
        <div class="header__branding">
            <h1>Tottenham Squad</h1>
            <p class="header__subtitle">Players by Position</p>
        </div>
    </header>

    <main>
        <div id="loadingContainer"></div>

        <div id="playerContainer">

            <div class="goalkeeper-container margin-container">
                <div class="player__card-layout player__card-heading u-flex u-items-center u-gap-heading">
                    <h1>Goalkeepers</h1>
                    <button class="scroll-button-left" id="button-left1">
                        ←
                    </button>
                    <button class="scroll-button-right" id="button-right1">
                        →
                    </button>
                </div>

                <div class="player__card-container" id="goalkeeperContainer">
                </div>

            </div>

            <div class="defender-container margin-container">

                <div class="player__card-layout player__card-heading u-flex u-items-center u-gap-heading">
                    <h1>Defenders</h1>
                    <button class="scroll-button-left" id="button-left2">
                        ←
                    </button>
                    <button class="scroll-button-right" id="button-right2">
                        →
                    </button>
                </div>

                <div class="player__card-container" id="defenderContainer">
                </div>

            </div>

            <div class="midfielder-container margin-container">

                <div class="player__card-layout player__card-heading u-flex u-items-center u-gap-heading">
                    <h1>Midfielders</h1>
                    <button class="scroll-button-left" id="button-left3">
                        ←
                    </button>
                    <button class="scroll-button-right" id="button-right3">
                        →
                    </button>
                </div>

                <div class="player__card-container" id="midfielderContainer">
                </div>
            </div>

            <div class="forward-container margin-container">

                <div class="player__card-layout player__card-heading u-flex u-items-center u-gap-heading">
                    <h1>Forwards</h1>
                    <button class="scroll-button-left" id="button-left4">
                        ←
                    </button>
                    <button class="scroll-button-right" id="button-right4">
                        →
                    </button>
                </div>

                <div class="player__card-container" id="forwardContainer">

                </div>

            </div>
        </div>



    </main>
    <script src="script.js"></script>
</body>

</html>
